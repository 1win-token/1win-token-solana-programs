[package]
name = "vesting-e2e"
version = "0.1.0"
description = "e2e tests for Vesting against surfpool (a real validator simulator): the lifecycle of the five buckets of §10.5 and the atomic funding transaction"
edition = "2021"
publish = false

# DUP: the dependency set is a copy of tests/sale-e2e/Cargo.toml;
# to be merged into svm-core (follow-up). `tokio` was not carried over (only
# Sale's load run needs it and Vesting has none), nor were `solana-account` /
# `solana-clock` / `solana-hash` - they are unused in this crate.

[dependencies]
# The program under test (the event and state types, the error codes) and the
# instruction builders from the shared test crate - the same interface the
# LiteSVM tests use.
vesting = { path = "../../programs/vesting", features = ["no-entrypoint"] }
vesting-test-common = { path = "../vesting" }
# The literal reference values - the same crate vesting-test-common uses.
vesting-expected = { path = "../vesting-expected" }
anchor-lang = "1.0.2"

# The RPC client to surfpool (blocking: the scenarios run sequentially).
solana-rpc-client = "3"
solana-rpc-client-api = "3"
solana-transaction-status-client-types = "3"
solana-commitment-config = "3"

# The same solana-* 3.x that anchor-lang 1.0.2 / tests/vesting resolve.
solana-compute-budget-interface = "3"
solana-instruction = "3"
solana-instruction-error = "2"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-program-pack = "3"
solana-pubkey = "3"
solana-sdk-ids = "3"
solana-signature = "3"
solana-signer = "3.0.0"
solana-system-interface = { version = "2.0", features = ["bincode"] }
solana-transaction = { version = "3.0.2", features = ["bincode"] }
solana-transaction-error = "3"

spl-token-interface = "2"
spl-associated-token-account-interface = "2"

# Transaction serialization (size), decoding inner instructions (base58), the
# cheat codes (JSON).
bincode = "1"
bs58 = "0.5"
serde_json = "1"
