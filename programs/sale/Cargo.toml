[package]
name = "sale"
version = "0.1.0"
description = "1WIN Token Sale program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sale"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# init-if-needed: only for the ATA of a signer receiving its own payout (`claim`,
# `withdraw_proceeds`, `sweep_*`) - the account may have been closed; the ATA
# address is deterministic and no state is re-initialized.
anchor-lang = { version = "1.0.2", features = ["event-cpi", "init-if-needed"] }
# Classic SPL Token (NOT token_interface / Token-2022 - forbidden by the spec).
anchor-spl = "1.0.2"

[dev-dependencies]
proptest = "1"
expected = { path = "../../tests/expected" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
